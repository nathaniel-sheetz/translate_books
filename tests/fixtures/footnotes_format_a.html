<p>The monkey was called &lsquo;Jacko I.,&rsquo;<a id="FNanchor_1_1"></a><a class="fnanchor pginternal" href="#Footnote_1_1">[1]</a> the frog was &lsquo;Mademoiselle Camargo.&rsquo;</p>
<div class="footnote">
<p><a id="Footnote_1_1"></a><a href="#FNanchor_1_1" class="pginternal"><span class="label">[1]</span></a> To distinguish him from Jacko II., a monkey belonging to Tony Johannot, the painter.</p>
</div>
<p>He wore it round his neck like an order of knighthood.<a id="FNanchor_2_2"></a><a class="fnanchor pginternal" href="#Footnote_2_2">[2]</a></p>
<div class="footnote">
<p><a id="Footnote_2_2"></a><a href="#FNanchor_2_2" class="pginternal"><span class="label">[2]</span></a> A second note mentioning <i>Le Cheval</i> by name.</p>
