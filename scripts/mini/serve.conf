# The model llama-server comes up with at login and after a crash.
# Read by llama-serve.sh as zsh. Edit it and run `start-server.sh --default`,
# or let `start-server.sh --set-default <gguf> <alias> [flags]` rewrite it.
#
# MODEL is a file in ~/models/gguf, or a full path. ALIAS is the name the API
# serves it under, and the name the save check's profiles are matched on
# (src/save_check_model.py: gemma-4-31b, qwen3.8-27b, gemma-4-26b, qwen3.6-35b).
MODEL=gemma-4-31B_q4_0-it.gguf
ALIAS=gemma-4-31b
EXTRA=()
